<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TabSync Studio Toolbar</title>
  <link rel="stylesheet" href="/widget/style.css">
</head>
<body>
  <div id="widget-container">
    <!-- Drag Handle -->
    <div class="drag-handle" title="Drag widget anywhere on screen">
      <svg class="app-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
      <span class="app-title">TabSync</span>
    </div>

    <!-- Accessibility warning badge (if permission missing) -->
    <button id="btn-perm-warn" class="perm-warn-btn hidden" title="Accessibility Permission Required for Remote Cursor. Click to Open Settings.">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      <span>Grant Access</span>
    </button>

    <div class="divider"></div>

    <!-- Mode Selector -->
    <div class="tool-group">
      <button id="btn-draw" class="tool-btn active" title="Pen (Draw over screen)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>
          <path d="m15 5 4 4"></path>
        </svg>
        <span>Pen</span>
      </button>

      <button id="btn-highlighter" class="tool-btn" title="Highlighter (Semi-transparent)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 11-6 6v3h3l6-6"></path>
          <path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"></path>
        </svg>
        <span>Marker</span>
      </button>

      <button id="btn-laser" class="tool-btn" title="Laser Pointer (Presenter mode)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <line x1="12" y1="2" x2="12" y2="6"></line>
          <line x1="12" y1="18" x2="12" y2="22"></line>
          <line x1="2" y1="12" x2="6" y2="12"></line>
          <line x1="18" y1="12" x2="22" y2="12"></line>
        </svg>
        <span>Laser</span>
      </button>

      <button id="btn-cursor" class="tool-btn" title="Cursor (Tablet acts as Trackpad)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 3 7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path>
          <path d="m13 13 6 6"></path>
        </svg>
        <span>Cursor</span>
      </button>

      <button id="btn-eraser" class="tool-btn" title="Eraser">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path>
          <path d="M22 21H7"></path>
          <path d="m5 11 9 9"></path>
        </svg>
        <span>Eraser</span>
      </button>
    </div>

    <div class="divider"></div>

    <!-- Colors -->
    <div class="swatches-group">
      <div class="swatch active" style="--swatch-color: #0ea5e9;" data-color="#0ea5e9" title="Studio Cyan"></div>
      <div class="swatch" style="--swatch-color: #f43f5e;" data-color="#f43f5e" title="Neon Crimson"></div>
      <div class="swatch" style="--swatch-color: #f59e0b;" data-color="#f59e0b" title="Solar Amber"></div>
      <div class="swatch" style="--swatch-color: #10b981;" data-color="#10b981" title="Emerald"></div>
      <div class="swatch" style="--swatch-color: #8b5cf6;" data-color="#8b5cf6" title="Royal Violet"></div>
      <div class="swatch" style="--swatch-color: #ffffff;" data-color="#ffffff" title="Chalk White"></div>
    </div>

    <div class="divider"></div>

    <!-- Size Selector -->
    <div class="size-group">
      <button class="size-btn" data-size="3" title="Fine (3px)">
        <span class="dot-preview" style="width: 4px; height: 4px;"></span>
      </button>
      <button class="size-btn active" data-size="6" title="Medium (6px)">
        <span class="dot-preview" style="width: 7px; height: 7px;"></span>
      </button>
      <button class="size-btn" data-size="12" title="Bold (12px)">
        <span class="dot-preview" style="width: 11px; height: 11px;"></span>
      </button>
      <button class="size-btn" data-size="20" title="Marker (20px)">
        <span class="dot-preview" style="width: 15px; height: 15px;"></span>
      </button>
    </div>

    <div class="divider"></div>

    <!-- Action Buttons -->
    <div class="action-group">
      <button id="btn-undo" class="icon-btn" title="Undo (Cmd+Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7v6h6"></path>
          <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
        </svg>
      </button>

      <button id="btn-redo" class="icon-btn" title="Redo (Cmd+Shift+Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 7v6h-6"></path>
          <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"></path>
        </svg>
      </button>

      <button id="btn-clear" class="icon-btn" title="Clear Screen Drawings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"></path>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
        </svg>
      </button>

      <button id="btn-snap" class="icon-btn" title="Capture Screenshot to Clipboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path>
          <circle cx="12" cy="13" r="3"></circle>
        </svg>
      </button>

      <button id="btn-qr" class="icon-btn status-btn" title="Device Pairing & Security">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="16" height="20" x="4" y="2" rx="2" ry="2"></rect>
          <path d="M12 18h.01"></path>
        </svg>
        <span id="conn-badge" class="conn-dot"></span>
      </button>

      <button id="btn-emergency-stop" class="icon-btn warning" title="Emergency Stop: Halt all remote input and release mouse">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
        </svg>
      </button>

      <button id="btn-close" class="icon-btn danger" title="Quit TabSync Studio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- QR Pairing & Paired Devices Sheet -->
  <div id="qr-popover" class="hidden">
    <div class="popover-content">
      <div class="popover-tabs">
        <button id="tab-pair-view" class="p-tab active">Pair New Tablet</button>
        <button id="tab-devices-view" class="p-tab">Paired Devices (<span id="paired-count">0</span>)</button>
        <button id="close-qr-btn" class="close-x">✕</button>
      </div>

      <!-- View 1: Pair New Tablet -->
      <div id="view-pair-panel">
        <div class="qr-wrapper">
          <img id="qr-img" src="" alt="Pairing QR Code">
        </div>

        <div class="pin-row">
          <span class="pin-title">Security PIN:</span>
          <span id="pin-number" class="pin-val">------</span>
          <button id="btn-refresh-pin" class="pin-refresh-btn" title="Generate New Pairing Code">↻</button>
        </div>

        <div class="popover-instructions">
          Scan with Android camera or open browser to:
        </div>
        <div id="tablet-ip-text" class="ip-badge">Connecting...</div>

        <div id="tablet-status-text" class="status-indicator">
          <span class="pulse-dot"></span>
          <span id="status-desc">Searching for tablets on local Wi-Fi...</span>
        </div>
      </div>

      <!-- View 2: Paired Devices Management -->
      <div id="view-devices-panel" class="hidden">
        <div id="devices-list" class="devices-list">
          <div class="empty-state">No paired devices yet.</div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/widget/widget.js"></script>
</body>
</html>
